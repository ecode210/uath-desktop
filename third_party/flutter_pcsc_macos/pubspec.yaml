name: flutter_pcsc_macos
description: macOS implementation of the flutter_pcsc plugin for using PCSC smartcard readers.
version: 0.0.3
repository: https://github.com/fabienrousseau/flutter_pcsc
publish_to: "none"

environment:
  sdk: ">=2.14.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^1.0.0
  flutter_pcsc_platform_interface: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
  ffigen: ^4.0.0

# Patched: upstream sets pluginClass to `none`, which Flutter 3.44+
# emits as invalid Swift (`none.register(...)`). Use the real stub class.
flutter:
  plugin:
    implements: flutter_pcsc
    platforms:
      macos:
        pluginClass: FlutterPcscMacosPlugin
        dartPluginClass: PcscMacOS

ffigen:
  name: NativeLibraryWinscard
  description: Bindings to PCSC.Framework (took headers from pcsclite)
  output: "generated_bindings.dart"
  headers:
    entry-points:
      - "headers/winscard.h"
